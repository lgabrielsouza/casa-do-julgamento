spring:
  application:
    name: casa-do-julgamento

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

integrations:
  sympla:
    base-url: https://api.sympla.com.br/public
    token: ${SYMPLA_API_TOKEN:}