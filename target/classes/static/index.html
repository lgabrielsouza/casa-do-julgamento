<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa do Julgamento</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main class="page">
        <section class="hero">
            <p class="eyebrow">CASA DO JULGAMENTO</p>
            <h1>Uma viagem ao seu destino final.</h1>
            <p>Faça sua inscrição para participar da experiência.</p>
        </section>

        <section class="card">
            <h2>Inscrição</h2>
            <form id="registrationForm">
                <input type="hidden" id="eventId" value="1">
                <input type="hidden" id="eventSessionId" value="1">

                <label>Nome completo
                    <input id="fullName" required maxlength="150">
                </label>

                <label>E-mail
                    <input id="email" type="email" required>
                </label>

                <label>CPF
                    <input id="cpf" inputmode="numeric" maxlength="11" required>
                </label>

                <label>Telefone
                    <input id="phone" required>
                </label>

                <label>Tipo de inscrição
                    <select id="type">
                        <option value="ATTENDEE">Participante</option>
                        <option value="STAFF">Staff / Equipe</option>
                    </select>
                </label>

                <label id="serviceAreaWrapper" hidden>Área de serviço
                    <input id="serviceArea" placeholder="Ex.: Mídia, Som, Portaria">
                </label>

                <button type="submit">Confirmar inscrição</button>
            </form>

            <div id="feedback" class="feedback" aria-live="polite"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
